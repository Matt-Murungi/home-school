[project]
name = "hs-core"
version = "0.1.0"
description = "Home School core service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "appwrite>=9",
    "sentry-sdk>=3.0,<4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "time-machine>=2.14",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The retention policy is a table of rules with long human-readable notes (rendered for the lawyer).
"src/hs_core/retention/policy.py" = ["E501"]
"src/hs_core/retention/render.py" = ["E501"]
# Row fixtures in the retention tests are one-line dict literals (`# fmt: skip`): readable as tables.
"tests/test_retention_*.py" = ["E501"]
"tests/retention_*.py" = ["E501"]
