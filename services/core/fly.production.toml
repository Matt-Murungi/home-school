# Fly.io config for the PRODUCTION core service (ADR 0003, F07). No secrets here: set them with
# `fly secrets set --app <app>` (docs/ops/secrets.md). Never deployed by agents; the app must exist first:
#   fly apps create homeschool-core-production --org <org-slug>
# UNVERIFIED against a real Fly account (owner-blocked); check with `fly config validate`.
app = "homeschool-core-production"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  HS_ENV = "production"

[deploy]
  strategy = "rolling"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    grace_period = "15s"
    interval = "15s"
    timeout = "3s"
