name: home_school_shared
description: Shared theme, API/auth interfaces, offline storage and widgets for the Home School apps.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.5
  flutter: ">=3.0.0"

dependencies:
  appwrite: ^28.4.1
  drift: ^2.35.4
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.9.2

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
